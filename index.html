// ===== UTILS =====
function genId() { return Date.now().toString(36) + Math.random().toString(36).slice(2,8); }
function now() { return new Date().toISOString().slice(0,19).replace('T',' '); }
function today() { return new Date().toISOString().slice(0,10); }
function formatWan(n) { return (n/10000).toFixed(1) + '万'; }
function getDaysRemaining(endDate) {
  const end = new Date(endDate); const now2 = new Date();
  end.setHours(0,0,0,0); now2.setHours(0,0,0,0);
  return Math.round((end - now2) / 86400000);
}
function getDaysServed(startDate) {
  const start = new Date(startDate); const now2 = new Date();
  start.setHours(0,0,0,0); now2.setHours(0,0,0,0);
  return Math.round((now2 - start) / 86400000);
}
function getStatusClass(status) {
  switch(status) {
    case '服务中': return 'status-active';
    case '即将到期': return 'status-warning';
    case '已到期': return 'status-danger';
    case '已终止': return 'status-terminated';
    case '已续约': return 'status-renewed';
    default: return 'status-default';
  }
}
function getFileIcon(type) {
  switch(type) { case 'pdf': return '📄'; case 'docx': case 'doc': return '📝'; case 'xlsx': case 'xls': return '📊'; case 'png': case 'jpg': case 'jpeg': return '🖼️'; default: return '📎'; }
}
function formatSize(bytes) { return bytes > 1048576 ? (bytes/1048576).toFixed(1)+' MB' : (bytes/1024).toFixed(0)+' KB'; }
function escHtml(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

  switch(currentPage) {

// ===== DASHBOARD =====
function renderDashboard() {
  const c = appData.contracts;
  const active = c.filter(x => x.status === '服务中').length;
  const expiring = c.filter(x => { const d = getDaysRemaining(x.endDate); return d >= 0 && d <= 30 && x.status !== '已终止' && x.status !== '已续约'; });
  const expired = c.filter(x => getDaysRemaining(x.endDate) < 0 && x.status !== '已终止' && x.status !== '已续约');
  const unpaid = c.filter(x => x.unpaidAmount > 0);
  const totalAmt = c.reduce((s,x) => s+x.contractAmount, 0);
  const totalRcv = c.reduce((s,x) => s+x.receivedAmount, 0);
  const totalUnp = c.reduce((s,x) => s+x.unpaidAmount, 0);
  const keyCount = c.filter(x => x.isKeyCustomer).length;

  // Region chart data
  const regionMap = {};
  c.forEach(x => { regionMap[x.region] = (regionMap[x.region]||0) + x.contractAmount; });
  const regionData = Object.entries(regionMap).sort((a,b) => b[1]-a[1]);
  const maxRegion = Math.max(...regionData.map(r=>r[1]), 1);

  return `
  <div class="page-header"><h2>首页仪表盘</h2></div>
  <div class="stats-grid">
    <div class="stat-card stat-blue"><div class="stat-value">${active}</div><div class="stat-label">服务中合同</div></div>
    <div class="stat-card stat-orange"><div class="stat-value">${expiring.length}</div><div class="stat-label">即将到期</div></div>
    <div class="stat-card stat-red"><div class="stat-value">${expired.length}</div><div class="stat-label">已到期未续约</div></div>
    <div class="stat-card stat-green"><div class="stat-value">${formatWan(totalAmt)}</div><div class="stat-label">合同总额</div></div>
    <div class="stat-card stat-cyan"><div class="stat-value">${formatWan(totalRcv)}</div><div class="stat-label">已收款</div></div>
    <div class="stat-card stat-purple"><div class="stat-value">${formatWan(totalUnp)}</div><div class="stat-label">未收款</div></div>
    <div class="stat-card stat-gold"><div class="stat-value">${c.length}</div><div class="stat-label">合同总数</div></div>
    <div class="stat-card stat-pink"><div class="stat-value">${keyCount}</div><div class="stat-label">重点客户</div></div>
  </div>
  <div class="charts-row">
    <div class="chart-card"><h3>区域合同额分布</h3>
      <div class="bar-chart">${regionData.map(([name,amt]) => `<div class="bar-item"><div class="bar-value">${formatWan(amt)}</div><div class="bar-fill" style="height:${Math.max(amt/maxRegion*180, 20)}px"></div><div class="bar-label">${name}</div></div>`).join('')}</div>
    </div>
    <div class="chart-card"><h3>合同状态分布</h3>
      <div style="padding:20px 0">${(() => { const sm={}; c.forEach(x=>{sm[x.status]=(sm[x.status]||0)+1}); return Object.entries(sm).map(([s,v])=>`<div style="display:flex;align-items:center;margin-bottom:10px"><span class="status-tag ${getStatusClass(s)}" style="min-width:70px;text-align:center">${s}</span><div style="flex:1;height:20px;background:#f0f0f0;border-radius:4px;margin:0 12px;overflow:hidden"><div style="height:100%;background:var(--primary);width:${v/c.length*100}%;border-radius:4px"></div></div><span style="font-size:13px;font-weight:600">${v}</span></div>`).join(''); })()}</div>
    </div>
  </div>
  <div class="lists-row">
    <div class="list-card"><h3>⏰ 到期提醒</h3>${expiring.length===0?'<p class="empty-text">暂无即将到期合同</p>':`<ul class="reminder-list">${expiring.map(x=>`<li class="reminder-item"><span class="reminder-name">${x.customerName}</span><span class="reminder-project">${x.projectName}</span><span class="reminder-days">剩余 ${getDaysRemaining(x.endDate)} 天</span></li>`).join('')}</ul>`}</div>
    <div class="list-card"><h3>💰 未回款提醒</h3>${unpaid.length===0?'<p class="empty-text">暂无未回款合同</p>':`<ul class="reminder-list">${unpaid.map(x=>`<li class="reminder-item"><span class="reminder-name">${x.customerName}</span><span class="reminder-project">${x.projectName}</span><span class="reminder-amount">未收 ${formatWan(x.unpaidAmount)}</span></li>`).join('')}</ul>`}</div>
  </div>`;
}

function renderContractRows(list) {
  return list.map(c => {
    const days = getDaysRemaining(c.endDate);
    const svc = days < 0 ? `已过期 ${Math.abs(days)} 天` : `剩余 ${days} 天`;
    return `<tr><td class="td-customer">${escHtml(c.customerName)}${c.isKeyCustomer?'<span class="key-badge">重点</span>':''}</td><td>${escHtml(c.projectName)}</td><td class="td-mono">${c.contractNo}</td><td>${c.region}</td><td class="td-amount">${formatWan(c.contractAmount)}</td><td class="td-amount text-green">${formatWan(c.receivedAmount)}</td><td class="td-amount${c.unpaidAmount>0?' text-red':''}">${c.unpaidAmount>0?formatWan(c.unpaidAmount):'-'}</td><td style="font-size:12px;color:var(--text-secondary)">${svc}</td><td><span class="status-tag ${getStatusClass(c.status)}">${c.status}</span></td><td>${c.salesPerson}</td><td><button class="btn-link" onclick="navigate('contract-detail','${c.id}')">详情</button></td></tr>`;
  }).join('');
}
function filterContracts() {
  const search = document.getElementById('cl-search').value;
  const status = document.getElementById('cl-status').value;
  const region = document.getElementById('cl-region').value;
  const filtered = appData.contracts.filter(c => {
    const ms = !search || c.customerName.includes(search) || c.projectName.includes(search) || c.contractNo.includes(search);
    const mst = !status || c.status === status;
    const mr = !region || c.region === region;
    return ms && mst && mr;
  });
  document.getElementById('cl-tbody').innerHTML = renderContractRows(filtered);
  document.getElementById('cl-count').textContent = `共 ${filtered.length} 条`;
}

function submitContractForm(editId) {
  const g = id => document.getElementById(id).value;
  const gc = id => document.getElementById(id).checked;
  const customerName = g('cf-customerName'), projectName = g('cf-projectName'), contractNo = g('cf-contractNo');
  if (!customerName || !projectName || !contractNo) { alert('请填写客户名称、项目名称和合同编号'); return; }
  const amt = Number(g('cf-contractAmount')), rcv = Number(g('cf-receivedAmount'));
  const data = { customerName, projectName, contractNo, province:g('cf-province'), city:g('cf-city'), district:g('cf-district'), region:g('cf-region'), contractAmount:amt, receivedAmount:rcv, unpaidAmount:amt-rcv, startDate:g('cf-startDate'), endDate:g('cf-endDate'), status:g('cf-status'), contactPerson:g('cf-contactPerson'), contactPhone:g('cf-contactPhone'), contactWechat:g('cf-contactWechat'), salesPerson:g('cf-salesPerson'), servicePerson:g('cf-servicePerson'), remark:g('cf-remark'), specialRequirements:g('cf-specialRequirements'), isKeyCustomer:gc('cf-isKeyCustomer'), isRenewalCustomer:gc('cf-isRenewalCustomer'), contractType:g('cf-contractType'), renewalStatus:g('cf-renewalStatus') };
  if (editId) {
    const idx = appData.contracts.findIndex(c=>c.id===editId);
    if (idx>=0) { appData.contracts[idx] = {...appData.contracts[idx], ...data, updatedAt:now()}; }
    appData.operationLogs.unshift({id:genId(),action:'修改',target:'合同',detail:`修改合同：${customerName}-${projectName}`,operator:'本机用户',createdAt:now()});
    alert('合同修改成功');
  } else {
    appData.contracts.unshift({...data, id:genId(), createdAt:now(), updatedAt:now()});
    appData.operationLogs.unshift({id:genId(),action:'新增',target:'合同',detail:`新增合同：${customerName}-${projectName}`,operator:'本机用户',createdAt:now()});
    alert('合同新增成功');
  }
  saveData(); navigate('contracts');
}

function deleteContract(id) {
  const c = appData.contracts.find(x=>x.id===id);
  if (!c) return;
  if (!confirm(`确定要删除合同「${c.customerName} - ${c.projectName}」吗？`)) return;
  if (!confirm('再次确认：删除后数据无法恢复，是否继续？')) return;
  appData.contracts = appData.contracts.filter(x=>x.id!==id);
  appData.operationLogs.unshift({id:genId(),action:'删除',target:'合同',detail:`删除合同：${c.customerName}-${c.projectName}`,operator:'本机用户',createdAt:now()});
  saveData(); navigate('contracts');
}

// ===== EXPIRING =====
function renderExpiring() {
  const c = appData.contracts;
  const d7 = c.filter(x=>{const d=getDaysRemaining(x.endDate);return d>=0&&d<=7&&x.status!=='已终止'&&x.status!=='已续约';}).length;
  const d15 = c.filter(x=>{const d=getDaysRemaining(x.endDate);return d>=0&&d<=15&&x.status!=='已终止'&&x.status!=='已续约';}).length;
  const d30 = c.filter(x=>{const d=getDaysRemaining(x.endDate);return d>=0&&d<=30&&x.status!=='已终止'&&x.status!=='已续约';}).length;
  const expired = c.filter(x=>getDaysRemaining(x.endDate)<0&&x.status!=='已终止'&&x.status!=='已续约');
  const expiring = c.filter(x=>{const d=getDaysRemaining(x.endDate);return d>=0&&d<=90&&x.status!=='已终止'&&x.status!=='已续约';}).sort((a,b)=>getDaysRemaining(a.endDate)-getDaysRemaining(b.endDate));
  function daysClass(d){if(d<=7)return'days-critical';if(d<=15)return'days-warning-badge';return'days-normal';}
  return `
  <div class="page-header"><h2>到期提醒</h2></div>
  <div class="expiring-summary">
    <div class="summary-item summary-red"><span class="summary-value">${d7}</span><span class="summary-label">7天内到期</span></div>
    <div class="summary-item summary-orange"><span class="summary-value">${d15}</span><span class="summary-label">15天内到期</span></div>
    <div class="summary-item summary-yellow"><span class="summary-value">${d30}</span><span class="summary-label">30天内到期</span></div>
    <div class="summary-item summary-dark"><span class="summary-value">${expired.length}</span><span class="summary-label">已过期未续约</span></div>
  </div>
  <div class="section-title">即将到期合同 (${expiring.length})</div>
  ${expiring.length===0?'<div class="empty-text" style="background:white;border-radius:8px;border:1px solid var(--border-color);padding:40px">当前无即将到期合同</div>':`<div class="table-wrapper"><table><thead><tr><th>客户名称</th><th>项目名称</th><th>到期时间</th><th>剩余天数</th><th>合同金额</th><th>续约状态</th><th>销售</th><th>操作</th></tr></thead><tbody>${expiring.map(x=>{const d=getDaysRemaining(x.endDate);return`<tr><td class="td-customer">${x.customerName}</td><td>${x.projectName}</td><td>${x.endDate}</td><td><span class="days-badge ${daysClass(d)}">${d} 天</span></td><td>${formatWan(x.contractAmount)}</td><td>${x.renewalStatus}</td><td>${x.salesPerson}</td><td><button class="btn-link" onclick="navigate('contract-detail','${x.id}')">详情</button></td></tr>`;}).join('')}</tbody></table></div>`}
  ${expired.length>0?`<div class="section-title section-danger" style="margin-top:24px">已过期未续约 (${expired.length})</div><div class="table-wrapper"><table><thead><tr><th>客户名称</th><th>项目名称</th><th>到期时间</th><th>过期天数</th><th>合同金额</th><th>续约状态</th><th>销售</th><th>操作</th></tr></thead><tbody>${expired.map(x=>`<tr class="row-expired"><td class="td-customer">${x.customerName}</td><td>${x.projectName}</td><td>${x.endDate}</td><td class="text-red">${Math.abs(getDaysRemaining(x.endDate))} 天</td><td>${formatWan(x.contractAmount)}</td><td>${x.renewalStatus}</td><td>${x.salesPerson}</td><td><button class="btn-link" onclick="navigate('contract-detail','${x.id}')">详情</button></td></tr>`).join('')}</tbody></table></div>`:''}`;
}

function showPaymentModal() {
  const unpaid = appData.contracts.filter(c=>c.unpaidAmount>0);

    <div class="form-item"><label>选择合同 *</label><select id="pm-contract"><option value="">请选择合同</option>${unpaid.map(c=>`<option value="${c.id}">${c.customerName} - ${c.projectName} (未收 ${formatWan(c.unpaidAmount)})</option>`).join('')}</select></div>

    <div class="form-item"><label>收款方式</label><select id="pm-method"><option>银行转账</option><option>支票</option><option>现金</option><option>其他</option></select></div>
    <div class="form-item"><label>备注</label><input id="pm-remark" placeholder="备注说明"></div>

function submitPayment() {
  const cid = document.getElementById('pm-contract').value;
  const amt = Number(document.getElementById('pm-amount').value);
  if (!cid||!amt) { alert('请选择合同并填写收款金额'); return; }
  appData.payments.unshift({id:genId(),contractId:cid,amount:amt,paymentDate:document.getElementById('pm-date').value,method:document.getElementById('pm-method').value,remark:document.getElementById('pm-remark').value,createdAt:now()});
  const ci = appData.contracts.findIndex(c=>c.id===cid);
  if (ci>=0) { appData.contracts[ci].receivedAmount += amt; appData.contracts[ci].unpaidAmount = appData.contracts[ci].contractAmount - appData.contracts[ci].receivedAmount; }
  appData.operationLogs.unshift({id:genId(),action:'收款',target:'收款记录',detail:`收款 ${formatWan(amt)}`,operator:'本机用户',createdAt:now()});
  saveData(); closeModal(); navigate('payments'); alert('收款记录添加成功');
}

    <div class="form-item"><label>跟进内容 *</label><textarea id="fw-content" rows="4" placeholder="请输入跟进内容"></textarea></div>
    <div class="form-item"><label>跟进人 *</label><input id="fw-person" placeholder="跟进人姓名"></div>
    <div class="form-item"><label>下次跟进时间</label><input type="date" id="fw-next"></div>
    <div class="modal-actions"><button class="btn-primary" onclick="submitFollow()">保存</button><button class="btn-cancel" onclick="closeModal()">取消</button></div>`);
}
function submitFollow() {
  const content = document.getElementById('fw-content').value;
  const person = document.getElementById('fw-person').value;
  if (!content||!person) { alert('请填写跟进内容和跟进人'); return; }
  const cust = appData.contracts.filter(c=>c.customerName===selectedCustomer);
  appData.followUps.unshift({id:genId(),customerId:selectedCustomer,contractId:cust[0]?.id,type:document.getElementById('fw-type').value,content,followPerson:person,nextFollowDate:document.getElementById('fw-next').value||undefined,createdAt:now()});
  saveData(); closeModal(); renderPage(); alert('跟进记录添加成功');
}

// ===== STATISTICS =====
function renderStatistics() {
  const c = appData.contracts;
  const regionMap={};c.forEach(x=>{regionMap[x.region]=(regionMap[x.region]||0)+x.contractAmount;});
  const regionData=Object.entries(regionMap).sort((a,b)=>b[1]-a[1]);
  const maxR=Math.max(...regionData.map(r=>r[1]),1);
  const custMap={};c.forEach(x=>{custMap[x.customerName]=(custMap[x.customerName]||0)+x.contractAmount;});
  const custData=Object.entries(custMap).sort((a,b)=>b[1]-a[1]).slice(0,8);
  const maxC=Math.max(...custData.map(r=>r[1]),1);
  const salesMap={};c.forEach(x=>{if(!salesMap[x.salesPerson])salesMap[x.salesPerson]={amount:0,count:0,renewals:0};salesMap[x.salesPerson].amount+=x.contractAmount;salesMap[x.salesPerson].count++;if(x.isRenewalCustomer)salesMap[x.salesPerson].renewals++;});
  const statusMap={};c.forEach(x=>{statusMap[x.status]=(statusMap[x.status]||0)+1;});
  const svcMap={};c.forEach(x=>{svcMap[x.servicePerson]=(svcMap[x.servicePerson]||0)+1;});
  const svcData=Object.entries(svcMap);const maxS=Math.max(...svcData.map(r=>r[1]),1);
  return `
  <div class="page-header"><h2>统计分析</h2></div>
  <div class="charts-grid">
    <div class="chart-card"><h3>按地区统计合同额</h3><div class="bar-chart">${regionData.map(([n,a])=>`<div class="bar-item"><div class="bar-value">${formatWan(a)}</div><div class="bar-fill" style="height:${Math.max(a/maxR*180,20)}px"></div><div class="bar-label">${n}</div></div>`).join('')}</div></div>
    <div class="chart-card"><h3>合同状态分布</h3><div style="padding:20px 0">${Object.entries(statusMap).map(([s,v])=>`<div style="display:flex;align-items:center;margin-bottom:10px"><span class="status-tag ${getStatusClass(s)}" style="min-width:70px;text-align:center">${s}</span><div style="flex:1;height:20px;background:#f0f0f0;border-radius:4px;margin:0 12px;overflow:hidden"><div style="height:100%;background:var(--primary);width:${v/c.length*100}%;border-radius:4px"></div></div><span style="font-weight:600">${v}</span></div>`).join('')}</div></div>
    <div class="chart-card"><h3>客户合同额排名</h3><div style="padding:10px 0">${custData.map(([n,a])=>`<div style="display:flex;align-items:center;margin-bottom:8px"><span style="width:120px;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${n}</span><div style="flex:1;height:18px;background:#f0f0f0;border-radius:4px;margin:0 8px;overflow:hidden"><div style="height:100%;background:#52c41a;width:${a/maxC*100}%;border-radius:4px"></div></div><span style="font-size:12px;font-weight:500">${formatWan(a)}</span></div>`).join('')}</div></div>
    <div class="chart-card"><h3>服务负责人项目数</h3><div class="bar-chart">${svcData.map(([n,v])=>`<div class="bar-item"><div class="bar-value">${v}</div><div class="bar-fill" style="height:${Math.max(v/maxS*180,20)}px;background:linear-gradient(180deg, #722ed1 0%, #b37feb 100%);box-shadow:0 2px 8px rgba(114,46,209,0.3)"></div><div class="bar-label">${n}</div></div>`).join('')}</div></div>
  </div>
  <div class="detail-card"><h3>销售负责人业绩统计</h3><div class="table-wrapper"><table><thead><tr><th>销售</th><th>合同额</th><th>客户数</th><th>续费数</th></tr></thead><tbody>${Object.entries(salesMap).map(([n,d])=>`<tr><td class="td-customer">${n}</td><td class="text-blue">${formatWan(d.amount)}</td><td>${d.count}</td><td>${d.renewals}</td></tr>`).join('')}</tbody></table></div></div>`;
}

// ===== ATTACHMENTS =====
function renderAttachments() {
  const atts = appData.attachments;
  return `
  <div class="page-header"><h2>附件管理</h2><button class="btn-primary" onclick="showAttachmentModal()">+ 上传附件</button></div>
  <div class="filter-bar"><label>分类筛选：</label><select id="att-filter" onchange="renderPage()"><option value="">全部分类</option><option>合同原件</option><option>报价单</option><option>验收材料</option><option>客户资料</option><option>其他</option></select><span class="filter-count">共 ${atts.length} 个附件</span></div>
  <div class="attachments-grid">${atts.map(a=>{const ct=appData.contracts.find(c=>c.id===a.contractId);return`<div class="attachment-card"><div class="attachment-icon">${getFileIcon(a.fileType)}</div><div class="attachment-info"><div class="attachment-name">${a.fileName}</div><div class="attachment-meta"><span>${a.category}</span><span>${formatSize(a.fileSize)}</span></div><div class="attachment-contract">${ct?ct.customerName+' - '+ct.projectName:'-'}</div><div class="attachment-date">${a.createdAt}</div></div></div>`;}).join('')}</div>`;
}
function showAttachmentModal() {
  showModal(`<h3>上传附件</h3><p style="font-size:12px;color:var(--warning);margin-bottom:16px">注：浏览器版本为模拟上传，文件不会实际保存</p>
    <div class="form-item"><label>选择合同 *</label><select id="att-contract"><option value="">请选择合同</option>${appData.contracts.map(c=>`<option value="${c.id}">${c.customerName} - ${c.projectName}</option>`).join('')}</select></div>
    <div class="form-item"><label>文件名 *</label><input id="att-filename" placeholder="例如：合同原件.pdf"></div>
    <div class="form-item"><label>附件分类</label><select id="att-category"><option>合同原件</option><option>报价单</option><option>验收材料</option><option>客户资料</option><option>其他</option></select></div>
    <div class="form-item"><label>备注说明</label><input id="att-remark" placeholder="附件说明"></div>
    <div class="modal-actions"><button class="btn-primary" onclick="submitAttachment()">确认上传</button><button class="btn-cancel" onclick="closeModal()">取消</button></div>`);
}
function submitAttachment() {
  const cid=document.getElementById('att-contract').value;
  const fn=document.getElementById('att-filename').value;
  if(!cid||!fn){alert('请选择合同并填写文件名');return;}
  const ext=fn.split('.').pop().toLowerCase();
  appData.attachments.unshift({id:genId(),contractId:cid,fileName:fn,fileType:ext,fileSize:Math.floor(Math.random()*2000000)+100000,category:document.getElementById('att-category').value,remark:document.getElementById('att-remark').value,filePath:`/mock/${fn}`,createdAt:today()});
  saveData();closeModal();renderPage();alert('附件记录已添加');
}

// ===== IMPORT/EXPORT =====
function renderImportExport() {
  const c = appData.contracts;
  return `
  <div class="page-header"><h2>导入导出</h2></div>
  <div class="ie-section"><h3>📤 数据导出</h3><div class="ie-grid">
    <div class="ie-card" onclick="exportAllCSV()"><div class="ie-icon">📋</div><div class="ie-title">导出全部合同</div><div class="ie-desc">导出所有合同数据为 CSV 文件</div><div class="ie-count">${c.length} 条数据</div></div>
    <div class="ie-card" onclick="exportExpiringCSV()"><div class="ie-icon">⏰</div><div class="ie-title">导出即将到期合同</div><div class="ie-desc">导出 30 天内到期的合同</div></div>
    <div class="ie-card" onclick="exportUnpaidCSV()"><div class="ie-icon">💰</div><div class="ie-title">导出未回款合同</div><div class="ie-desc">导出所有未完全回款的合同</div><div class="ie-count">${c.filter(x=>x.unpaidAmount>0).length} 条</div></div>
  </div></div>
  <div class="ie-section"><h3>📥 数据导入</h3><div class="ie-grid">
    <div class="ie-card" onclick="alert('请使用备份恢复功能中的 JSON 导入')"><div class="ie-icon">📊</div><div class="ie-title">导入数据</div><div class="ie-desc">从 JSON 备份文件导入数据</div></div>
  </div></div>`;
}
function exportCSV(data, filename) {
  if(!data.length){alert('没有数据可导出');return;}
  const headers=Object.keys(data[0]);
  const csv=[headers.join(','),...data.map(row=>headers.map(h=>{const v=String(row[h]??'');return v.includes(',')?`"${v}"`:v;}).join(','))].join('\n');
  const blob=new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8;'});
  const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=filename;a.click();URL.revokeObjectURL(url);
}
function exportAllCSV() {
  exportCSV(appData.contracts.map(c=>({客户名称:c.customerName,项目名称:c.projectName,合同编号:c.contractNo,战区:c.region,合同金额:c.contractAmount,已收款:c.receivedAmount,未收款:c.unpaidAmount,开始时间:c.startDate,结束时间:c.endDate,状态:c.status,销售:c.salesPerson,服务:c.servicePerson})),`合同列表_${today()}.csv`);
}
function exportExpiringCSV() {
  const exp=appData.contracts.filter(c=>{const d=getDaysRemaining(c.endDate);return d>=0&&d<=30;});
  exportCSV(exp.map(c=>({客户名称:c.customerName,项目名称:c.projectName,到期时间:c.endDate,合同金额:c.contractAmount,续约状态:c.renewalStatus,销售:c.salesPerson})),`即将到期合同_${today()}.csv`);
}
function exportUnpaidCSV() {
  const unp=appData.contracts.filter(c=>c.unpaidAmount>0);
  exportCSV(unp.map(c=>({客户名称:c.customerName,项目名称:c.projectName,合同金额:c.contractAmount,已收款:c.receivedAmount,未收款:c.unpaidAmount,销售:c.salesPerson})),`未回款合同_${today()}.csv`);
}

// ===== BACKUP =====
function renderBackup() {
  const c=appData.contracts,p=appData.payments,f=appData.followUps,a=appData.attachments;
  return `
  <div class="page-header"><h2>备份与恢复</h2></div>
  <div class="backup-stats">
    <div class="backup-stat-card"><span class="backup-stat-value">${c.length}</span><span class="backup-stat-label">合同数据</span></div>
    <div class="backup-stat-card"><span class="backup-stat-value">${p.length}</span><span class="backup-stat-label">收款记录</span></div>
    <div class="backup-stat-card"><span class="backup-stat-value">${f.length}</span><span class="backup-stat-label">跟进记录</span></div>
    <div class="backup-stat-card"><span class="backup-stat-value">${a.length}</span><span class="backup-stat-label">附件记录</span></div>
    <div class="backup-stat-card"><span class="backup-stat-value">${appData.operationLogs.length}</span><span class="backup-stat-label">操作日志</span></div>
  </div>
  <div class="backup-actions">
    <button class="btn-primary" onclick="exportJSON()">📦 导出数据包 (JSON)</button>
    <button class="btn-export" onclick="importJSON()">📥 导入数据包</button>
    <button class="btn-danger" onclick="resetData()">🗑️ 重置数据</button>
  </div>
  <div class="backup-info"><p>💡 数据存储在浏览器 localStorage 中，清除浏览器数据会丢失。</p><p>💡 建议定期导出 JSON 数据包进行备份。</p></div>`;
}
function exportJSON() {
  const blob=new Blob([JSON.stringify(appData,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=`合同管理备份_${today()}.json`;a.click();URL.revokeObjectURL(url);alert('数据包导出成功！');
}
function importJSON() {
  const input=document.createElement('input');input.type='file';input.accept='.json';
  input.onchange=e=>{const file=e.target.files[0];if(!file)return;const reader=new FileReader();reader.onload=ev=>{try{const data=JSON.parse(ev.target.result);if(data.contracts){appData=data;saveData();renderPage();alert('数据导入成功！');}else{alert('无效的备份文件');}}catch(err){alert('文件解析失败：'+err.message);}};reader.readAsText(file);};
  input.click();
}
function resetData() {
  if(!confirm('确定要重置所有数据吗？此操作不可恢复！'))return;
  if(!confirm('再次确认：所有合同、收款、跟进记录都将被清除！'))return;
  appData=getDefaultData();saveData();renderPage();alert('数据已重置为初始状态');
}

// ===== SETTINGS =====
function renderSettings() {
  const logs = appData.operationLogs;
  return `
  <div class="page-header"><h2>系统设置</h2></div>
  <div class="settings-section"><h3>到期提醒</h3>
    <div class="setting-item"><div class="setting-info"><label>默认提醒天数</label><p class="setting-desc">合同到期前多少天开始提醒</p></div><div class="setting-control"><select><option value="7">7 天</option><option value="15">15 天</option><option value="30" selected>30 天</option><option value="60">60 天</option><option value="90">90 天</option></select></div></div>
  </div>
  <div class="settings-section"><h3>数据存储</h3>
    <div class="setting-item"><div class="setting-info"><label>存储方式</label><p class="setting-desc">当前数据存储在浏览器 localStorage 中</p></div><div class="setting-control"><span style="font-size:13px;color:var(--text-tertiary)">浏览器本地存储</span></div></div>
  </div>
  <div class="settings-section"><h3>关于系统</h3>
    <div class="about-info"><p><strong>index</strong> v1.0.0 (HTML版)</p><p>纯前端实现，数据存储在浏览器 localStorage</p><p>支持导出/导入 JSON 数据包进行备份和迁移</p></div>
  </div>
  <div class="settings-section"><h3>操作日志（最近 10 条）</h3>
    <div class="table-wrapper"><table><thead><tr><th>操作</th><th>对象</th><th>详情</th><th>操作人</th><th>时间</th></tr></thead><tbody>${logs.slice(0,10).map(l=>`<tr><td><span style="display:inline-block;padding:1px 6px;border-radius:3px;font-size:11px;font-weight:500;${l.action==='新增'?'background:#f6ffed;color:#52c41a':l.action==='修改'?'background:#e6f4ff;color:#1890ff':l.action==='删除'?'background:#fff2f0;color:#ff4d4f':'background:#fff7e6;color:#fa8c16'}">${l.action}</span></td><td>${l.target}</td><td>${l.detail}</td><td>${l.operator}</td><td class="td-mono">${l.createdAt}</td></tr>`).join('')}</tbody></table></div>
  </div>`;
}

// ===== INIT =====
initNav();
renderPage();
</script>
</body>
</html>
